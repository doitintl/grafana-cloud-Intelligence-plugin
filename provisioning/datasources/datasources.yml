apiVersion: 1

datasources:
  - name: 'DoiT Cloud Intelligence'
    type: 'doitintl-doitcloudintelligence-datasource'
    uid: doit-cloud-intelligence
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      # Defaults to https://api.doit.com when empty
      apiUrl: '${DOIT_API_URL}'
    secureJsonData:
      apiKey: '${DOIT_API_KEY}'
